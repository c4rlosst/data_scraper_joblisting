# Copy to config.yaml and adjust.

filters:
  # A job must match at least one of these (title or description).
  include_keywords: ["python", "data engineer"]
  # Any of these in the title/description rejects the job.
  exclude_keywords: ["senior director", "intern"]
  # Only look for keywords in the title (faster, fewer false positives).
  title_only: false
  # Case-insensitive substrings matched against the job's location. Empty = any.
  locations: ["remote", "europe", "worldwide"]
  remote_only: false
  # Minimum yearly salary in USD. Jobs with no salary info pass unless
  # require_salary is true.
  min_salary: 0
  require_salary: false
  # Ignore postings older than this many days (0 = no limit).
  max_age_days: 30

sources:
  remotive: true
  remoteok: true
  arbeitnow: true
  # Company boards on Greenhouse / Lever. Use the slug from the careers URL,
  # e.g. boards.greenhouse.io/<slug> or jobs.lever.co/<slug>.
  greenhouse: []
  lever: []

storage:
  db_path: jobs.db
  export_dir: exports
